<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Crie sua conta.">
	<link rel="stylesheet" href="cadastro.css">
	<title>Criar conta</title>
</head>
<body>
	<main class="signup-container">
		<a class="back-link" href="../src/index.html">Voltar ao login</a>
		<h1>Criar conta</h1>
		<p class="intro">Preencha seus dados para continuar.</p>

		<form id="signup-form">
			<div class="field">
				<label for="name">Nome completo</label>
				<input type="text" id="name" name="name" autocomplete="name" required>
			</div>

			<div class="field">
				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Senha</label>
				<input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
				<small>Use pelo menos 8 caracteres.</small>
			</div>

			<div class="field">
				<label for="confirm-password">Confirme a senha</label>
				<input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
			</div>

			<button type="submit">Criar conta</button>
			<p class="form-message" id="form-message" role="status" aria-live="polite"></p>
		</form>
	</main>

	<script src="cadastro.js" defer></script>
</body>
</html>
